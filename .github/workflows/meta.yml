name: Weekly meta (Chasing the meta)
on:
  schedule:
    - cron: '7 21 * * 3'   # Thursday 8:07am Sydney (summer time), after the Footfall data
  workflow_dispatch:
  push:
    paths: ['tools/build_meta.py', '.github/workflows/meta.yml']
permissions:
  contents: write
concurrency: meta
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_meta.py
      - name: Save the result
        run: |
          git config user.name "40k Caddie meta"
          git config user.email "actions@users.noreply.github.com"
          git add footfall/meta.json
          git diff --cached --quiet || git commit -m "Weekly meta summary"
          git pull --rebase
          git push
