name: Weekly rules check
on:
  schedule:
    - cron: '17 20 * * 3'   # Thursday 7:17am Sydney (summer time)
  workflow_dispatch:
  push:
    paths: ['tools/check_rules.py', '.github/workflows/rules-check.yml']
permissions:
  contents: write
concurrency: rules-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_rules.py
      - name: Save the result
        run: |
          git config user.name "40k Caddie rules check"
          git config user.email "actions@users.noreply.github.com"
          git add rules-status.json
          git diff --cached --quiet || git commit -m "Weekly rules check"
          git push
