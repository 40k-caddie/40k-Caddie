<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="description" content="A Warhammer 40,000 11th edition game companion.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="40k Caddie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>40k Caddie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@700;900&family=Barlow+Condensed:wght@400;500;600;700&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app; army theme owns the frame, foe theme owns its territory. Deliberately dark-only. */
:root {
  color-scheme: dark;
  --bg: #0B0A09; --panel: #14110E; --panel2: #17130F; --line: #3A3128; --line2: #6B5B45;
  --text: #F2EAD6; --muted: #B8AE98; --dim: #8F8676;
  --accent: #9E1B1B; --accent-text: #E25A50; --gold: #D9C27A; --good: #D9C27A;
  --head: 'Pirata One', 'Cinzel', Georgia, serif; --head-weight: 400; --head-size: 1;
  --body: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --foe-font: 'Chakra Petch', 'Barlow Condensed', sans-serif;
  --foe-a: #FFE0EC; --foe-b: #FF8FC0; --foe-c: #FF4F9C; --foe-d: #F0287F;
  --foe-text: #1A0510; --foe-soft: #FF8FC0; --foe-deep: #1E0C15; --foe-line: #8A2A58;
}
body.army-carc {
  --bg: #05080B; --panel: rgba(14, 20, 25, 0.86); --panel2: rgba(17, 24, 30, 0.92); --line: #2E3A44; --line2: #59636B;
  --text: #F2EBDA; --muted: #A8B0B6; --dim: #7D878F; --accent: #8E1B1B; --accent-text: #E0675E; --good: #CDBE9C;
  --head: 'Cinzel', Georgia, serif; --head-weight: 900; --head-size: 0.78;
}
body.army-other {
  --bg: #0E1013; --panel: #171A1F; --panel2: #1B1F25; --line: #323843; --line2: #59606B;
  --text: #EEF0F3; --muted: #A9B0BA; --dim: #858C96; --accent: #3A4F78; --accent-text: #8FB0F0; --good: #B9CC63;
  --head: 'Cinzel', Georgia, serif; --head-weight: 700; --head-size: 0.8;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
.h { font-family: var(--head); font-weight: var(--head-weight); color: var(--text); line-height: 1; text-wrap: balance; margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid var(--line2); background: transparent; color: var(--text); font-weight: 700; letter-spacing: 0.06em; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.solid { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.red { background: var(--accent); border: 2px solid var(--accent-text); color: var(--text); }
.btn.gold { border: 2px solid var(--gold); color: var(--gold); background: transparent; }
.btn.small { min-height: 36px; padding: 0 10px; font-size: 14px; }
.btn.block { width: 100%; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; color: var(--text); display: inline-flex; align-items: center; justify-content: center; }
.panel { background: var(--panel); border: 1px solid var(--line); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pre-head { width: 100%; gap: 10px; background: none; border: 0; color: var(--text); padding: 0; min-height: 40px; text-align: left; font-size: 17px; }
.pre-n { flex: 0 0 30px; height: 30px; border: 1px solid var(--gold); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.pre-step.done { opacity: 0.6; } .pre-step.done .pre-n { background: var(--gold); color: #14110E; }
.pre-extra { border-left: 2px solid var(--gold); padding-left: 10px; } .pre-extra ul { margin: 4px 0 0; padding-left: 18px; }
.linkish { background: none; border: 0; color: var(--gold); text-decoration: underline; padding: 0; font-size: inherit; min-height: 32px; }
.offmap { display: block; border: 1px solid var(--line2); background: #0c0c0c; min-height: 60px; position: relative; }
.offmap img { display: block; width: 100%; height: auto; }
.offmap-fail { display: none; padding: 14px 12px; }
.offmap.failed img { display: none; } .offmap.failed .offmap-fail { display: block; }
.calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.calc-f { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.calc-f input, .calc-f select { min-height: 40px; padding: 0 8px; background: var(--bg); border: 1px solid var(--line2); color: var(--text); font-size: 16px; }
.calc-out { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.calc-out div { border: 1px solid var(--line); padding: 6px 2px; display: flex; flex-direction: column; }
.calc-out b { font-size: 20px; } .calc-out span { font-size: 11px; color: var(--muted); }
.calc-out .big { border-color: var(--gold); } .calc-out .big b { color: var(--gold); }
.dt { width: 100%; border-collapse: collapse; font-size: 14px; } .dt td, .dt th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; } .dt th { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.dt.two { columns: 2; } .dt.two tr { display: inline-table; width: 48%; margin-right: 2%; }
.gl { border: 1px solid var(--line); background: var(--panel); }
.gl > summary { list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; min-height: 44px; cursor: pointer; }
.gl > summary::-webkit-details-marker { display: none; }
.gl[open] > summary { border-bottom: 1px solid var(--line); }
.gl-x { padding: 10px 12px; font-size: 15px; line-height: 1.45; }
.chip.on { border-color: var(--gold); color: var(--gold); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--line2); font-size: 14px; font-weight: 600; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 13px; }
input[type=text], input[type=number], select, textarea { width: 100%; min-height: 44px; padding: 8px 12px; background: rgba(0,0,0,0.35); border: 1px solid var(--line2); border-radius: 0; color: var(--text); font-size: 16px; }
textarea { min-height: 120px; line-height: 1.35; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; }
/* Header bands */
.band { background: var(--panel2); border-top: 3px solid var(--accent); position: relative; }
body.army-carc .band { padding-bottom: 30px !important; }
body.army-carc .band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24px; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='24' viewBox='0 0 18 24'><rect width='18' height='24' fill='%23CDBE9C'/><rect width='18' height='1.6' fill='%2314110E'/><path d='M0 3 L9 3 L4.5 10 Z' fill='%2314110E'/><path d='M9.6 3.4 L17.4 3.4 L13.5 9.4 Z' fill='none' stroke='%2314110E' stroke-width='0.9'/><path d='M13.5 3.6 V8.6' stroke='%2314110E' stroke-width='0.8'/><circle cx='2.25' cy='12' r='0.9' fill='%2314110E'/><circle cx='6.75' cy='12' r='0.9' fill='%2314110E'/><circle cx='11.25' cy='12' r='0.9' fill='%2314110E'/><circle cx='15.75' cy='12' r='0.9' fill='%2314110E'/><path d='M0.6 20.6 L8.4 20.6 L4.5 14.6 Z' fill='none' stroke='%2314110E' stroke-width='0.9'/><path d='M4.5 20.4 V15.4' stroke='%2314110E' stroke-width='0.8'/><path d='M9 21 L18 21 L13.5 14 Z' fill='%2314110E'/><rect y='22.4' width='18' height='1.6' fill='%2314110E'/></svg>") 0 0 / 18px 24px repeat-x; }
body.army-templars .band { padding-bottom: 22px !important; }
body.army-templars .band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='14' viewBox='0 0 24 14'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23E9ECEF'/><stop offset='0.45' stop-color='%239AA1A8'/><stop offset='1' stop-color='%233C4146'/></linearGradient></defs><rect x='-14.6' y='5.1' width='17.2' height='3.8' rx='1.9' fill='url(%23g)' stroke='%23111315' stroke-width='0.9'/><rect x='9.4' y='5.1' width='17.2' height='3.8' rx='1.9' fill='url(%23g)' stroke='%23111315' stroke-width='0.9'/><rect x='-2.5999999999999996' y='2' width='17.2' height='10' rx='5' fill='none' stroke='%23111315' stroke-width='4.4'/><rect x='-2.5999999999999996' y='2' width='17.2' height='10' rx='5' fill='none' stroke='url(%23g)' stroke-width='2.6'/><rect x='21.4' y='2' width='17.2' height='10' rx='5' fill='none' stroke='%23111315' stroke-width='4.4'/><rect x='21.4' y='2' width='17.2' height='10' rx='5' fill='none' stroke='url(%23g)' stroke-width='2.6'/></svg>") 0 0 / 24px 14px repeat-x, #0B0A09; animation: chainRun 4s linear infinite; }
@keyframes chainRun { to { background-position: 24px 0, 0 0; } }
/* Foe colour */
@keyframes shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.foe-fill { background-image: linear-gradient(90deg, var(--foe-a), var(--foe-b), var(--foe-c), var(--foe-d)); background-size: 260% 100%; animation: shift 9s ease-in-out infinite; color: var(--foe-text); }
.foe-panel { background: var(--foe-deep); border: 1px solid var(--foe-line); }
.foe-ink { color: var(--foe-soft); }
.foe-font { font-family: var(--foe-font); }
/* Carcharodon void */
#void { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: none; background:
  radial-gradient(1px 1px at 12% 18%, #C9D3DA88 50%, transparent 51%), radial-gradient(1px 1px at 72% 9%, #C9D3DA66 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 33% 62%, #C9D3DA55 50%, transparent 51%), radial-gradient(1px 1px at 88% 44%, #C9D3DA77 50%, transparent 51%),
  radial-gradient(1px 1px at 52% 83%, #C9D3DA66 50%, transparent 51%), radial-gradient(1.2px 1.2px at 7% 76%, #C9D3DA55 50%, transparent 51%),
  radial-gradient(1px 1px at 63% 31%, #C9D3DA44 50%, transparent 51%), radial-gradient(1px 1px at 92% 90%, #C9D3DA55 50%, transparent 51%),
  radial-gradient(ellipse at 50% 42%, #0D141A 0%, #05080B 58%, #020304 100%); }
body.army-carc #void { display: block; }
/* Muster */
.step-btn { min-height: 54px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; }
.step-btn b { font-size: 13px; letter-spacing: 0.06em; }
.step-btn span { font-size: 12px; color: var(--muted); }
.step-btn.on { border: 2px solid var(--text); }
.army-btn { min-width: 0; aspect-ratio: 3 / 2; max-height: 140px; width: 100%; border: 1px solid var(--line2); background: transparent; padding: 6%; display: flex; align-items: center; justify-content: center; }
.army-btn svg { width: 100%; height: 100%; filter: grayscale(0.85) brightness(0.62); transition: filter 0.2s; }
.army-btn.on { border: 2px solid var(--text); background: var(--panel); }
.army-btn.on svg { filter: none; }
.sigil { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)); }
.sigil-mask { -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-size: 260% 100%; animation: shift 9s ease-in-out infinite; filter: none; }
.rival .sigil-mask { width: 72%; aspect-ratio: 1; }
.rivals { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.rival-wrap { display: flex; flex-direction: column; min-width: 0; }
.rival { min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.rival .sigil { width: 72%; height: auto; aspect-ratio: 1; max-width: 150px; margin-bottom: 4px; }
.rival .rival-name { font-size: 17px; font-weight: 700; line-height: 1.1; }
.rival.on { border: 2px solid var(--glow); background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--glow) 22%, transparent), var(--panel) 70%); }
.rival.on .sigil { filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)) drop-shadow(0 0 10px var(--glow)); }
.clash { position: relative; height: 60px; background: #050404; overflow: hidden; }
.clash .mine { position: absolute; inset: 0; background: var(--panel2); clip-path: polygon(0 0, 58% 0, 50% 44%, 55% 56%, 43% 100%, 0 100%); display: flex; align-items: center; padding-left: 14px; }
.clash .theirs { position: absolute; inset: 0; clip-path: polygon(61% 0, 100% 0, 100% 100%, 46% 100%, 58% 56%, 53% 44%); display: flex; align-items: center; justify-content: flex-end; padding-right: 14px; }
.clash .vs { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; display: flex; align-items: center; justify-content: center; background: var(--bg); border: 2px solid var(--accent-text); transform: rotate(45deg); }
.clash .vs span { transform: rotate(-45deg); font-size: 12px; font-weight: 700; }
.clash .name { font-family: var(--head); font-weight: var(--head-weight); font-size: calc(22px * var(--head-size)); line-height: 1; position: relative; }
@keyframes chain { to { stroke-dashoffset: -64; } }
.chain { animation: chain 1.6s linear infinite; }
@keyframes mawTop { 0%, 66%, 100% { transform: translateY(0); } 80% { transform: translateY(15px); } 94% { transform: translateY(0); } }
@keyframes mawBot { 0%, 66%, 100% { transform: translateY(0); } 80% { transform: translateY(-15px); } 94% { transform: translateY(0); } }
@keyframes mawDark { 0%, 64%, 100% { opacity: 0; } 80% { opacity: 0.7; } 94% { opacity: 0; } }
.maw-top { animation: mawTop 7s ease-in-out infinite; } .maw-bot { animation: mawBot 7s ease-in-out infinite; } .maw-dark { opacity: 0; animation: mawDark 7s ease-in-out infinite; }
.fight-btn { min-height: 62px; width: 100%; background: var(--accent); border: 2px solid var(--accent-text); color: var(--text); font-family: var(--head); font-weight: var(--head-weight); font-size: calc(27px * var(--head-size)); display: flex; align-items: center; justify-content: center; gap: 10px; }
/* Overlays */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 4, 4, 0.74); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; background: var(--bg); border-top: 3px solid var(--accent); box-shadow: 0 -12px 30px rgba(0,0,0,0.6); padding-bottom: env(safe-area-inset-bottom, 0px); }
body.army-carc .sheet { background: #070B0F; }
.sheet.foe-sheet { border-top-color: var(--foe-c); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px 6px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-body { overflow-y: auto; padding-block: 6px 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet-body > * { flex-shrink: 0; }
.sheet-foot { padding-block: 10px 14px; border-top: 1px solid var(--line); }
/* Battle */
.bhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
.phase-row { display: flex; align-items: center; justify-content: center; gap: 2px; }
.phase-name { font-family: var(--head); font-weight: var(--head-weight); font-size: calc(30px * var(--head-size)); min-width: 130px; text-align: center; }
.score { display: grid; grid-template-columns: 52px repeat(3, minmax(0, 1fr)); gap: 4px 6px; align-items: center; }
.ctr { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); background: var(--panel); }
.ctr button { width: 38px; height: 40px; border: 0; background: transparent; font-size: 20px; font-weight: 700; color: var(--muted); }
.ctr b { font-size: 20px; }
.ctr.foe b { color: var(--foe-soft); }
.bnav { position: sticky; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--panel2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bnav button { min-height: 56px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 2px; line-height: 1.05; text-align: center; }
.bnav button.on { color: var(--text); box-shadow: inset 0 3px 0 var(--accent-text); }
.bnav button.foe-tab.on { box-shadow: inset 0 3px 0 var(--foe-c); }
.main { flex: 1; padding-block: 14px 24px; }
.strat { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 54px; padding: 8px 12px; text-align: left; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.strat .nm { font-size: 16px; font-weight: 700; }
.strat .ds { font-size: 13px; color: var(--muted); }
.cp { flex: 0 0 auto; padding: 3px 8px; border: 1px solid var(--accent-text); font-size: 14px; font-weight: 700; }
.strat.foe { background: var(--foe-deep); border-color: var(--foe-line); }
.strat.foe .cp { border-color: var(--foe-c); color: var(--foe-soft); }
.unit { border: 1px solid var(--line); background: var(--panel); }
.unit.dead { opacity: 0.45; }
.unit-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px 4px 12px; }
.unit-top button.name { border: 0; background: transparent; padding: 0; text-align: left; color: var(--text); font-size: 17px; font-weight: 700; min-height: 44px; flex: 1; min-width: 0; }
.pips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 6px; }
.pip { width: 14px; height: 14px; border: 1px solid var(--line2); background: var(--text); }
.pip.hurt { background: linear-gradient(90deg, var(--text) var(--p), var(--accent) var(--p)); }
.pip.gone { background: transparent; border-color: var(--line); }
.unit-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.unit-actions button { min-height: 44px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--text); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }
.unit-actions button:last-child { border-right: 0; }
.group { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px dashed var(--line2); }
.statline { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; text-align: center; }
.statline div { background: var(--panel2); padding: 4px 0; line-height: 1.1; }
.statline small { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; font-weight: 700; }
.statline b { font-size: 16px; }
.tbl-wrap { overflow-x: auto; }
table.wpn { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.wpn th, table.wpn td { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
table.wpn th:first-child, table.wpn td:first-child { text-align: left; white-space: normal; }
table.wpn th { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
.math { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; text-align: center; }
.math div { background: var(--panel2); padding: 6px 0; line-height: 1.05; }
.math b { font-size: 21px; display: block; }
.math span { font-size: 12px; color: var(--muted); }
