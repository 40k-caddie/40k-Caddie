name: Weekly Footfall data
on:
  schedule:
    - cron: '41 20 * * 3'   # Thursday 7:41am Sydney (summer time), after the rules check
  workflow_dispatch:
  push:
    paths: ['tools/build_footfall.py', '.github/workflows/footfall-data.yml']
permissions:
  contents: write
concurrency: footfall-data
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/BSData/wh40k-11e.git /tmp/bsdata
      - run: python tools/build_footfall.py /tmp/bsdata footfall
      - name: Save the result
        run: |
          git config user.name "40k Caddie data"
          git config user.email "actions@users.noreply.github.com"
          git add footfall
          git diff --cached --quiet || git commit -m "Weekly Footfall data from BSData"
          git pull --rebase
          git push
