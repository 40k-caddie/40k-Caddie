name: Meta probe (one-off)
on:
  push:
    paths: ['tools/probe_meta.py']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe_meta.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe
