name: Weekly Footfall data
on:
  schedule:
    - cron: '41 20 * * 3'   # Thursday 7:41am Sydney (summer time), after the rules check
  workflow_dispatch:
  push:
    paths: ['tools/build_footfall.py', 'tools/check_footfall.js', 'footfall.js', '.github/workflows/footfall-data.yml']
permissions:
  contents: write
concurrency: footfall-data
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git clone --depth 1 https://github.com/BSData/wh40k-11e.git /tmp/bsdata
      - run: python tools/build_footfall.py /tmp/bsdata footfall
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # every unit in every army: added, grown, given each option, priced; a crash fails this run so it gets noticed
      - name: Engine sweep
        id: sweep
        run: node tools/check_footfall.js footfall || echo "failed=1" >> "$GITHUB_OUTPUT"
      - name: Save the result
        run: |
          git config user.name "40k Caddie data"
          git config user.email "actions@users.noreply.github.com"
          git add footfall
          git diff --cached --quiet || git commit -m "Weekly Footfall data from BSData"
          git pull --rebase
          git push
      - name: Fail if the sweep found a crash
        if: steps.sweep.outputs.failed == '1'
        run: exit 1
